      lshift: Trans
      Z: NoKey
      X: "!"
      C: ^
      V: "|"
      B: "\\"
    row3:
      lctrl: NoKey
      command: NoKey
      option: Trans
    thumb_keys:
      left: Trans
      middle: Space
      right: NoKey
  right_hand:
    row0:
      "Y": ¥
      U: _
      I: (
      O: )
      P: "%"
      backspace: "-"
    row1:
      H: "#"
      J: +
      K: "["
      L: "]"
      colon: ":"
      enter: ";"
    row2:
      "N": "&"
      M: "-"
      comma: "{"
      dot: "}"
