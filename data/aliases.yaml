modified:
  "LSFT(KC_GRAVE)": ["~", Tilde]
  "LSFT(KC_1)": ["!", Exclaim, ExclamationMark]
  "LSFT(KC_2)": ["@", At, AtSign]
  "LSFT(KC_3)": ["#", Hash, Pound, NumberSign]
  "LSFT(KC_4)": ["$", Dollar, DollarSign]
  "LSFT(KC_5)": ["%", Percent, PercentSign]
  "LSFT(KC_6)": ["^", Caret, Circumflex]
  "LSFT(KC_7)": ["&", And, Ampersand]
  "LSFT(KC_8)": ["*", Asterisk, Star]
  "LSFT(KC_9)": ["(", LeftParen, LParenthesis, LeftParenthesis]
  "LSFT(KC_0)": [")", RightParen, RParenthesis, RightParenthesis]
  "LSFT(KC_MINUS)": [_, Underscore]
  "LSFT(KC_EQUAL)": ["+", Plus, PlusSign]
  "LSFT(KC_LBRACKET)": ["{", LBrace, LeftBrace, LeftCurlyBrace]
  "LSFT(KC_RBRACKET)": ["}", RBrace, RightBrace, RightCurlyBrace]
  "LSFT(KC_BSLASH)": ["|", Pipe, VerticalBar]
  "LSFT(KC_SCOLON)": [":", Colon]
  "LSFT(KC_QUOTE)": ["\"", DoubleQuote]
  "LSFT(KC_COMMA)": ["<", LessThan, LAngleBracket, LeftAngleBracket]
  "LSFT(KC_DOT)": [">", GreaterThan, RAngleBracket, RightAngleBracket]
  "LSFT(KC_SLASH)": ["?", Question, QuestionMark]
  "LALT(KC_Y)": ["¥"]
