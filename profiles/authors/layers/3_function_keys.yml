---
name: Function Keys
index: 3
description: |-
  ファンクションキー・テンキーレイヤー
  左手: F1〜F12（上段 Q から F1〜F4、中段 F5〜F8、下段 F9〜F12）、BT 切り替え
  右手: テンキー（数字レイヤーの並びに 7・8・9 を追加）

  呼び出し: 右エンコーダ押し込み（ホールドで一時切替、タップでトグル）
           右親指の一番左・左手 fn（ホールドのみ）
  クリック: レイヤー0の ← + ↓ / ↓ + → コンボ
mapping:
  left_hand:
    row0:
      tab: Escape
      Q: F1
      W: F2
      E: F3
      R: F4
      T: NoKey
    row1:
      lctrl: { key: BT2, note: Bluetooth プロファイル 2 に切り替え }
      A: F5
      S: F6
      D: F7
      F: F8
      G: NoKey
    row2:
      lshift: { key: BT1, note: Bluetooth プロファイル 1 に切り替え }
      Z: F9
      X: F10
      C: F11
      V: F12
      B: { key: ClearBT, note: 現在の Bluetooth プロファイルのペアリングを消去 }
    row3:
      caps: { key: BT0, note: Bluetooth プロファイル 0 に切り替え }
      fn: Trans
      option: Trans
    thumb_keys:
      left: Trans
      middle: NoKey
      right: { key: TapDance('Screen Capture'), note: タップで範囲スクリーンショット、長押しで画面収録 }
  right_hand:
    row0:
      Y: NoKey
      U: Kp7
      I: Kp8
      O: Kp9
      P: KpEqual
      backspace: Backspace
    row1:
      H: NoKey
      J: Kp4
      K: Kp5
      L: Kp6
      colon: KpPlus
      enter: KpAsterisk
    row2:
      N: NoKey
      M: Kp1
      comma: Kp2
      dot: Kp3
      up: KpMinus
      rshift: Trans
    row3:
      left: KpDot
      down: KpSlash
      right: KpEnter
    thumb_keys:
      left: Trans
      middle: Kp0
      right: NoKey
  encoders:
    left:
      push: Mute
      ccw: VolumeDown
      cw: VolumeUp
    right:
      push: Trans
      ccw: MouseWheelUp
      cw: MouseWheelDown
