---
name: iPad Base
index: 4
description: iPad用ベースレイアウト（マウス操作対応エンコーダ）
mapping:
  left_hand:
    row0:
      tab: Tab
      Q: Q
      W: W
      E: E
      R: R
      T: T
    row1:
      lctrl: LCtrl
      A: A
      S: S
      D: D
      F: F
      G: G
    row2:
      lshift: LShift
      Z: Z
      X: X
      C: C
      V: V
      B: B
    row3:
      caps: CapsLock
      fn: MO(8)
      option: LAlt
    thumb_keys:
      left:
        key: LGUI_T(KC_LANG2)
        note: タップで英数、長押しで Command
      middle:
        key: LT1(Space)
        note: タップで Space、長押しで Symbols レイヤー
      right:
        key: LT2(Escape)
        note: タップで Escape、長押しで Numbers レイヤー
  right_hand:
    row0:
      Y: Y
      U: U
      I: I
      O: O
      P: P
      backspace: Backspace
    row1:
      H: H
      J: J
      K: K
      L: L
      colon: ";"
      enter: "\\"
    row2:
      N: N
      M: M
      comma: ","
      dot: .
      up: /
      rshift:
        key: RSFT_T(Up)
        note: タップで ↑、長押しで Shift
    row3:
      left: Left
      down: Down
      right: Right
    thumb_keys:
      left:
        key: LT2(Enter)
        note: タップで Enter、長押しで Numbers レイヤー
      middle: MO(1)
      right:
        key: LT3(KC_LANG1)
        note: タップでかな、長押しで Function Keys レイヤー
  encoders:
    left:
      push: Mute
      ccw: VolumeDown
      cw: VolumeUp
    right:
      push: OSL(9)
      ccw: KC_F14
      cw: KC_F15
