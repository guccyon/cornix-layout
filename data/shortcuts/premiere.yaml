# Premiere Pro のショートカット（cornixhub https://cornixhub.com/shortcuts の一覧から。2026-10-19 取得）。
# Shortcut('アプリ:カテゴリ:ラベル') で参照する（例: Shortcut('Premiere Pro:再生:再生/一時停止')）。
# 1 つのキーコードで表せないもの（連続して押すもの・押したまま操作するもの）は入れていない
Premiere Pro:
  再生:
    再生/一時停止: Space
    逆再生: J
    停止: K
    再生: L
    次のフレーム: Right
    前のフレーム: Left
    イン点を設定: I
    アウト点を設定: O
    編集点を追加: Command + K
    リップル削除: Shift + Delete
  ツール:
    選択ツール: V
    トラック選択: A
    リップルツール: B
    ローリング編集ツール: "N"
    レーザーツール: C
    スリップツール: "Y"
    ペンツール: P
    ハンドツール: H
  タイムライン:
    タイムラインに合わせる: "\\"
    ズームイン: "="
    ズームアウト: "-"
    クリップをリンク: Command + L
    シーケンスをネスト: Shift + Command + N
