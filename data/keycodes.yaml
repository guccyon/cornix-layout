# Cornix (Vial protocol 6) の名前付きキーコード表。
# - name: 設定ファイルに書く名前。vial: false でなければ layout.vil にもこの名前を書く（Vial GUI が保存する名前）
# - qmk:  受け付ける別の QMK 名
# - vial: false は Vial GUI に名前がない値（vial-qmk の quantum/keycodes.h にはある）。
#   設定ファイルでは name で書けるが、.vil には Vial GUI が読める 0xHHHH で書く。
#   基準は Vial Web（vial.rocks）の中身の vial-gui 0.7.5。それより後に足された MAGIC_TOGGLE_GUI と、
#   Vial GUI が 16 個しか名前を作らない USER16〜USER63 もここに入る。
#   RMK 0.8 のファームウェアはこれらを何もしないキーとして扱う（RGB や Magic など既存の多くの値も同じ）。
# 引数付きのキーコード（LSFT(kc), LT(n, kc), MO(n), TD(n), M0 など）はここに書かず、
# Cornix::Mapping::KeycodeCodec の定数で組み立てる。
# shifted は入力専用の名前（KC_EXLM など）。.vil には LSFT(KC_1) の形で書く。
# shifted の qmk は QMK の長い名前（KC_LEFT_PAREN など。旧コードのマクロ text 展開が書き出していた）。
# Cornix が対応していないとみられる値（QK_REPEAT_KEY、USER08 以降など）は data/unsupported_keycodes.yaml で警告する。
# 元データ: vial-gui の keycodes.py / keycodes_v6.py から抽出した表（実機 560 キーで一致を確認済み）。
# qmk の名前と vial: false の値は QMK の data/constants/keycodes/*.hjson（最新）と vial-qmk の quantum/keycodes.h で補った。
