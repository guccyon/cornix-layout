name: RSpec

# Ruby のテスト。PR では VS Code 拡張（editors/vscode/）だけの変更なら動かさない（そちらは vscode.yml）。
# main への push では今までどおり毎回動かす。
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'editors/vscode/**'
      - '.github/workflows/vscode.yml'

permissions:
  contents: read

jobs:
  rspec:
    name: rspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler: latest
          bundler-cache: true
      - name: 読み込み時に警告が出ないこと
        run: |
          out=$(ruby -w -Ilib -e 'require "cornix"' 2>&1)
          for f in bin/*; do out+=$(ruby -wc "$f" 2>&1 >/dev/null); done
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi
      - run: bundle exec rspec
