---
name: Base
index: 0
description: Base layer with standard QWERTY layout and layer switching
mapping:
  left_hand:
    row0:
      tab: { key: TapDance('Tab Escape'), note: タップで Tab、長押しで Escape }
      Q: Q
      W: W
      E: E
      R: R
      T: T
    row1:
      lctrl: LCtrl
      A: A
      S: S
      D: D
      F: F
      G: G
    row2:
      lshift: LShift
      Z: Z
      X: X
      C: C
      V: V
      B: B
    row3:
      caps: CapsLock
      fn: { key: MO(3), note: 押している間 Function Keys レイヤー }
      option: LAlt
    thumb_keys:
      left: { key: LGUI_T(KC_LANG2), note: タップで英数、長押しで Command }
      middle: { key: LT1(Space), note: タップで Space、長押しで Symbols レイヤー }
      right: { key: MO(2), note: 押している間 Numbers レイヤー }
  right_hand:
    row0:
      Y: Y
      U: U
      I: I
      O: O
      P: P
      backspace: Backspace
    row1:
      H: H
      J: J
      K: K
      L: L
      colon: "-"
      enter: Enter
    row2:
      N: N
      M: M
      comma: ","
      dot: .
      up: Up
      rshift: RShift
    row3:
      left: Left
      down: Down
      right: Right
    thumb_keys:
      left: { key: MO(3), note: 押している間 Function Keys レイヤー }
      middle: { key: MO(1), note: 押している間 Symbols レイヤー }
      right: { key: LT2(KC_LANG1), note: タップでかな、長押しで Numbers レイヤー }
  encoders:
    left:
      push: Mute
      ccw: VolumeDown
      cw: VolumeUp
    right:
      push: { key: TapDance('Layer 3 Toggle'), note: タップで Function Keys レイヤーをトグル、長押しで一時切り替え }
      ccw: Up
      cw: Down
