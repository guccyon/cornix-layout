name: VS Code 拡張

# editors/vscode/ の型検査・ビルド・単体テスト（vitest）・統合テスト（@vscode/test-electron）。
# 拡張が読む data/ と、Ruby と共通の約束のテストのデータ（spec/fixtures/protocol/・candidates/）が変わったときも動かす。
on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'data/**'
      - 'spec/fixtures/protocol/**'
      - 'spec/fixtures/candidates/**'
      - '.github/workflows/vscode.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - 'data/**'
      - 'spec/fixtures/protocol/**'
      - 'spec/fixtures/candidates/**'
      - '.github/workflows/vscode.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: editors/vscode

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: ビルド
        run: npm run build
      - name: 単体テスト
        run: npm test
      - name: 統合テスト
        run: xvfb-run -a npm run test:integration
