# キー入力欄の候補の分類と、場面（context）ごとに上に出すもの。
# VS Code 拡張の keycode/candidates が使う（Ruby の Cornix::Mapping::CandidateCatalog。将来の TypeScript 版も同じものを読む）。
#
# - categories: 分類 → キーの名前（data/keycodes.yaml の name）。並びは候補の並び（同じ分類の中で、ここに書いた順が先）
# - defaults:   categories に書いていないキーの分類。キーの値で次の 4 つに分けて決める。ここで決まるキーは値の小さい順
#               special  0x0000・0x0001（data/keycodes.yaml の special: の節。KC_NO / KC_TRNS）
#               basic    data/keycodes.yaml の basic: の節の値
#               quantum  data/keycodes.yaml の quantum: の節の値（キーボード定義の customKeycodes を含む）
#               modified basic / quantum のどちらでもない名前のある値（data/aliases.yaml の modified と shifted: の名前。"!" "¥" など）
# - order:      分類の並び（候補を並べるときの既定の順）
# - contexts:   場面（protocol.md の 5.3・12.4 の context）ごとの候補の扱い
#               prefer.categories  上に出す分類（order の分類か、プロファイルと入力から作る layer / macro / tapDance / shortcut / presetShortcut / raw）
#               prefer.keys        上に出すキーの名前（data/keycodes.yaml の name）
#               prefer.baseLayer   true ならベースレイヤー（レイヤー 0）に割り当ててある値（KC_NO・KC_TRNS を除く）と同じ値の候補を上に出す
#               exclude.categories 出さない分類（params の all: true なら出す）
#               上に出すものどうしは prefer.categories に書いた順（ベースレイヤーの値はその先頭、prefer.keys はそのあと）、同じなら order と同じ規則で並べる
#
# 分類の名前は protocol.md の CandidateCategory のうち、キーの表から作るもの（basic / modifier / media / mouse / special）。
# layer / macro / tapDance / shortcut / presetShortcut / raw は表ではなく、プロファイルと data/shortcuts/ と入力から作る。
categories:
  modifier: [KC_LCTRL, KC_LSHIFT, KC_LALT, KC_LGUI, KC_RCTRL, KC_RSHIFT, KC_RALT, KC_RGUI]
  media:
    - KC_VOLU
    - KC_VOLD
    - KC_MUTE
    - KC_MPLY
    - KC_MNXT
    - KC_MPRV
    - KC_MSTP
    - KC_MFFD
    - KC_MRWD
    - KC_EJCT
    - KC_MSEL
    - KC_BRIU
    - KC_BRID
    - KC__VOLUP
    - KC__VOLDOWN
    - KC_MAIL
    - KC_CALC
    - KC_MYCM
    - KC_WSCH
    - KC_WHOM
    - KC_WBAK
    - KC_WFWD
    - KC_WSTP
    - KC_WREF
    - KC_WFAV
    - KC_PWR
    - KC_SLEP
    - KC_WAKE
  mouse:
    - KC_BTN1
    - KC_BTN2
    - KC_BTN3
    - KC_BTN4
    - KC_BTN5
    - KC_MS_U
    - KC_MS_D
    - KC_MS_L
    - KC_MS_R
    - KC_WH_U
    - KC_WH_D
    - KC_WH_L
    - KC_WH_R
    - KC_ACL0
    - KC_ACL1
    - KC_ACL2
defaults:
  special: special    # KC_NO / KC_TRNS
  basic: basic
  quantum: special
  modified: basic     # "!" "@" "¥" など
order: [basic, modifier, media, mouse, special]
contexts:
  layerKey:
    prefer:
      categories: [basic]
  encoder:
    prefer:
      categories: [media]
      keys: [KC_WH_U, KC_WH_D, KC_WH_L, KC_WH_R]
  # マクロの手順のキー。マクロのファイルは名前参照を読まないので、all: true で出すマクロ・タップダンスは M0 / TD(4) の形。
  # Shortcut(...) はマクロのファイルでは読めないので all: true でも出さない
  macroKey:
    prefer:
      categories: [basic, modifier, media]
    exclude:
      categories: [layer, macro, tapDance, shortcut, presetShortcut]
  # タップダンスの動作（そのタップダンス自身は params の exclude で除く）
  tapDanceAction:
    prefer:
      categories: [basic, layer]
  # コンボの同時に押すキー
  comboTrigger:
    prefer:
      baseLayer: true
    exclude:
      categories: [layer, macro, tapDance, shortcut, presetShortcut]
  # コンボの出すキー
  comboOutput:
    prefer:
      categories: [macro, basic]
  # shortcuts.yaml の値（Shortcut(...) は書けない）。修飾キー式は打った文字を typed で解釈するので、候補では修飾キーと基本キーを上に出す
  shortcutValue:
    prefer:
      categories: [modifier, basic]
    exclude:
      categories: [shortcut, presetShortcut]
