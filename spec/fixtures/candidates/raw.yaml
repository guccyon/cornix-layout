# 直接の値（0x で始まるときだけ。先頭に出す）
- context: layerKey
  query: '0x7E40'
  expect: ['0x7E40']
- context: layerKey
  query: '0x0004'
  expect: [A]
- context: layerKey
  query: '0x7c79'
  expect: [Repeat]
  warning:
    Repeat: Cornix は Repeat Key に対応していません
# 書き込み禁止の値は出さない
- context: layerKey
  query: '0x7C00'
  expect: []
- context: layerKey
  query: '0x'
  expect: []
- context: layerKey
  query: '0xZZ'
  expect: []
# insertText は references 付きの decompile の正規形
- context: layerKey
  query: '0x7700'
  references:
    macros: [{ index: 0, name: Bracket Pair }]
  expect: ["Macro('Bracket Pair')"]
- context: layerKey
  query: '0x7701'
  references:
    macros: [{ index: 0, name: Bracket Pair }]
  expect: [M1]
- context: layerKey
  query: '0x0806'
  references:
    shortcuts: [{ name: コピー, text: Command + C }]
  expect: ["Shortcut('コピー')"]
