# Cornix が対応していないとみられるキーコードの範囲。
# Vial の名前はあるが、Cornix を接続した Vial（vial.rocks）のキー選択欄には表示されない値。
# 書き込みは止めず、validate / compile / status / apply で warning を出す。
# vial-gui は requires_feature（キーボードが報告する対応機能）と customKeycodes の個数でキーを隠す
# （vial-gui の src/main/python/keycodes/keycodes.py の recreate_keyboard_keycodes）。2026-10-19 に実機で確認。
ranges:
  - { from: 0x7C79, to: 0x7C7A, reason: 'Cornix は Repeat Key（repeat_key）に対応していません' }
  - { from: 0x7C7B, to: 0x7C7B, reason: 'Cornix は Layer Lock（layer_lock）に対応していません' }
  - { from: 0x7E08, to: 0x7E3F, reason: 'Cornix のユーザーキーは USER00〜USER07（BT0〜ClearPeer）だけです' }
