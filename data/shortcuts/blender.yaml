# Blender のショートカット（cornixhub https://cornixhub.com/shortcuts の一覧から。2026-10-19 取得）。
# Shortcut('アプリ:カテゴリ:ラベル') で参照する（例: Shortcut('Blender:変形:グラブ')）。
# 1 つのキーコードで表せないもの（連続して押すもの・押したまま操作するもの）は入れていない
Blender:
  変形:
    グラブ: G
    回転: R
    拡大縮小: S
    X軸に拘束: X
    Y軸に拘束: "Y"
    Z軸に拘束: Z
    押し出し: E
    ループカット: Ctrl + R
    ベベル: Ctrl + B
    インセット: I
  選択:
    全選択: A
    すべて選択解除: Option + A
    ボックス選択: B
    円選択: C
    リンクを選択: L
    ループ選択: Option + Space
  編集モード:
    オブジェクトモード: Tab
    編集モード: Tab
    頂点選択: '1'
    エッジ選択: '2'
    面選択: '3'
  表示:
    正面図: Kp1
    右側面図: Kp3
    上面図: Kp7
    カメラビュー: Kp0
    パース切り替え: Kp5
    選択範囲をフレーム: KpDot
