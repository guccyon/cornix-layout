version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
