---
name: Layer 1
description: ''
index: 1
mapping:
  left_hand:
    row0:
      tab: Escape
      Q: "?"
      W: "\""
      E: =
      R: NoKey
      T: "~"
    row1:
      caps: Trans
      A: "@"
      S: "'"
      D: $
      F: /
      G: "`"
