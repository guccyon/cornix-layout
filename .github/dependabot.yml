version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    ignore:
      # engines.vscode（package.json）と手でそろえる。先に上がると vsce package が通らない
      - dependency-name: '@types/vscode'
    groups:
      npm:
        patterns: ['*']
