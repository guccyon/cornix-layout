# KiCad のショートカット（cornixhub https://cornixhub.com/shortcuts の一覧から。2026-10-19 取得）。
# Shortcut('アプリ:カテゴリ:ラベル') で参照する（例: Shortcut('KiCad:コンポーネント:シンボルを追加')）。
# 複数の手順のもの（macro:）は Shortcut(...) では使えない。macros/ のファイルに preset: 'アプリ:カテゴリ:ラベル' と書いて使う
KiCad:
  コンポーネント:
    シンボルを追加: A
    電源シンボルを追加: P
    ワイヤーを作成: W
    バス: B
    ラベル: L
    グローバルラベル: Ctrl + L
    接続なし: Q
    ジャンクション: J
    シンボルを編集: E
    値を編集: V
    参照を編集: U
    コンポーネントを回転: R
    X軸でミラー: X
    Y軸でミラー: "Y"
  ルーティング:
    ルート: X
    ビアを追加: V
    フットプリントを追加: A
    ゾーンを塗りつぶす: Ctrl + Shift + Z
    トレース幅を変更: W
    グリッドを変更: G
    レイヤーを切り替え: F
    フットプリントを回転: R
    フットプリントを反転: F
    コンポーネントのプロパティ: E
    ネットをハイライト: "`"
    DRCを実行: Ctrl + Shift + D
  表示:
    ズームイン: F1
    ズームアウト: F2
    全体表示: Home
    選択範囲にズーム: F3
    再描画: F5
    3Dビュー: Option + 3
    レイヤー切り替え: H
    グリッド表示切替: Ctrl + G
  編集:
    コンポーネントを移動: M
    ドラッグ: D
    コピー: Ctrl + C
    ペースト: Ctrl + V
    削除: Delete
    元に戻す: Ctrl + Z
    やり直し: Ctrl + Y
    複製: Ctrl + D
    オブジェクトをグループ化: Ctrl + G
  ファイル:
    新規ファイル: Ctrl + N
    開く: Ctrl + O
    保存: Ctrl + S
    名前を付けて保存: Ctrl + Shift + S
    プロット: Ctrl + P
    印刷: Ctrl + Shift + P
